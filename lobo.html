<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobo: Unstable Variable // m0ck1ngb1rd</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #e5e7eb; min-height: 100vh; }
        .neon-text { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
        .neon-border { border: 1px solid #ff00ff; box-shadow: 0 0 15px rgba(255, 0, 255, 0.3); }
        .nav-btn { background: rgba(255, 0, 255, 0.1); border: 1px solid #ff00ff; transition: all 0.3s; z-index: 50; }
        .nav-btn:hover { background: #ff00ff; color: black; box-shadow: 0 0 20px #ff00ff; }
        
        /* Container del fumetto */
        .comic-wrapper {
            max-width: 900px;
            width: 100%;
            transition: max-width 0.4s ease;
            cursor: zoom-in;
        }

        /* Classe per lo Zoom Reale */
        .comic-wrapper.zoomed {
            max-width: 1536px; 
            cursor: zoom-out;
        }

        #comic-page {
            width: 100%;
            height: auto;
            display: block;
        }

        .controls-sticky {
            position: sticky;
            bottom: 20px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px solid rgba(255, 0, 255, 0.4);
            box-shadow: 0 0 20px rgba(0,0,0,1);
        }
    </style>
</head>
<body class="flex flex-col items-center p-2 md:p-8">

    <header class="text-center mb-6">
        <h1 class="text-2xl md:text-4xl font-black neon-text uppercase tracking-tighter">Lobo: Unstable Variable</h1>
        <p class="text-gray-500 text-[10px] uppercase tracking-widest mt-1">Clicca sulla tavola per lo ZOOM 1:1</p>
    </header>

    <main id="main-container" class="comic-wrapper neon-border bg-black rounded-lg mb-24 overflow-hidden" onclick="toggleZoom()">
        <img id="comic-page" src="BRA01.png" alt="Lobo Comic Page">
    </main>

    <nav class="controls-sticky flex items-center justify-center gap-6 z-50">
        <button onclick="event.stopPropagation(); prevPage()" class="nav-btn px-6 py-2 rounded-full uppercase font-black text-xs">Indietro</button>
        <span id="page-counter" class="font-mono text-xl neon-text min-w-[80px] text-center">1 / 13</span>
        <button onclick="event.stopPropagation(); nextPage()" class="nav-btn px-6 py-2 rounded-full uppercase font-black text-xs">Avanti</button>
    </nav>

    <footer class="mt-4 mb-10">
        <a href="fumetti.html" class="text-gray-500 hover:text-pink-500 transition-all text-xs font-bold uppercase tracking-widest">
            &larr; Torna all'Archivio
        </a>
    </footer>

    <script>
        const pages = [
            "BRA01.png", "BRA02.png", "BRA03.png", "BRA04.png", 
            "BRA05.png", "BRA06.png", "BRA07.png", "BRA08.png", 
            "BRA09.png", "BRA10.png", "BRA11.png", "BRA12.png", "BRA13.png"
        ];
        
        let currentIndex = 0;
        const mainContainer = document.getElementById('main-container');
        const imgElement = document.getElementById('comic-page');
        const counterElement = document.getElementById('page-counter');

        function toggleZoom() {
            mainContainer.classList.toggle('zoomed');
        }

        function updatePage() {
            imgElement.style.opacity = "0.3";
            setTimeout(() => {
                imgElement.src = pages[currentIndex];
                counterElement.innerText = `${currentIndex + 1} / ${pages.length}`;
                imgElement.style.opacity = "1";
                mainContainer.classList.remove('zoomed');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 150);
        }

        function nextPage() { if (currentIndex < pages.length - 1) { currentIndex++; updatePage(); } }
        function prevPage() { if (currentIndex > 0) { currentIndex--; updatePage(); } }

        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") nextPage();
            if (e.key === "ArrowLeft") prevPage();
        });
    </script>
</body>
</html>
