<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Lobo: Family Affairs // m0ck1ngb1rd</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #e5e7eb; }
        .neon-text { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
        .neon-border { border: 1px solid #ff00ff; box-shadow: 0 0 15px rgba(255, 0, 255, 0.3); }
        .nav-btn { background: rgba(255, 0, 255, 0.1); border: 1px solid #ff00ff; transition: all 0.3s; }
        .nav-btn:hover { background: #ff00ff; color: black; box-shadow: 0 0 20px #ff00ff; }
        
        /* Miglioramento visualizzazione tavola */
        .comic-container {
            max-width: 1000px; /* Più largo su desktop */
            width: 100%;
        }
        #comic-page {
            width: 100%;
            height: auto;
            cursor: zoom-in;
            transition: transform 0.2s ease;
        }
        /* Zoom al click per leggere meglio i testi piccoli */
        #comic-page:active {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center p-2 md:p-8">

    <header class="text-center mb-6 z-10">
        <h1 class="text-2xl md:text-4xl font-black neon-text uppercase tracking-tighter">Lobo: Fraggin' Hearts</h1>
        <p class="text-gray-500 text-[10px] uppercase tracking-widest">Usa le frecce o i tasti sotto | Clicca la tavola per zoom</p>
    </header>

    <main class="comic-container relative flex flex-col items-center z-10">
        
        <div class="neon-border bg-black rounded-lg mb-6 w-full overflow-hidden">
            <img id="comic-page" src="BRA01.png" alt="Lobo Comic Page">
        </div>

        <div class="flex flex-col items-center gap-4 w-full mb-10">
            <div class="flex items-center justify-center gap-4">
                <button onclick="prevPage()" class="nav-btn px-6 py-3 rounded-full uppercase font-black text-xs">Indietro</button>
                <span id="page-counter" class="font-mono text-xl neon-text min-w-[80px] text-center">1 / 13</span>
                <button onclick="nextPage()" class="nav-btn px-6 py-3 rounded-full uppercase font-black text-xs">Avanti</button>
            </div>
        </div>
    </main>

    <footer class="pb-10">
        <a href="fumetti.html" class="text-gray-500 hover:text-pink-500 transition-all text-xs font-bold uppercase tracking-widest">
            &larr; Torna all'Archivio
        </a>
    </footer>

    <script>
        const pages = [
            "BRA01.png", "BRA02.png", "BRA03.png", "BRA04.png", 
            "BRA05.png", "BRA06.png", "BRA07.png", "BRA08.png", 
            "BRA09.png", "BRA10.png", "BRA11.png", "BRA12.png", "BRA13.png"
        ];
        
        let currentIndex = 0;
        const imgElement = document.getElementById('comic-page');
        const counterElement = document.getElementById('page-counter');

        function updatePage() {
            imgElement.style.opacity = "0.5";
            setTimeout(() => {
                imgElement.src = pages[currentIndex];
                counterElement.innerText = `${currentIndex + 1} / ${pages.length}`;
                imgElement.style.opacity = "1";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 100);
        }

        function nextPage() { if (currentIndex < pages.length - 1) { currentIndex++; updatePage(); } }
        function prevPage() { if (currentIndex > 0) { currentIndex--; updatePage(); } }

        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") nextPage();
            if (e.key === "ArrowLeft") prevPage();
        });
    </script>
</body>
</html>
        });
    </script>
</body>
</html>
